services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: famax_mes
      POSTGRES_USER: famax
      POSTGRES_PASSWORD: famax-local
    ports:
      - "5432:5432"
    volumes:
      - famax_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famax -d famax_mes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  famax_postgres:
